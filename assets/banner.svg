<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Pulsing animations for dynamic background nodes -->
    <style>
      .node-pulse {
        animation: pulse 3s infinite alternate ease-in-out;
      }
      .flow-line {
        stroke-dasharray: 10, 15;
        animation: dash 20s linear infinite;
      }
      @keyframes pulse {
        0% { r: 6px; opacity: 0.4; }
        100% { r: 12px; opacity: 0.9; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Background Elements (Pills / Nodes / Flow Data Lines) -->
  <g stroke="#818cf8" stroke-opacity="0.25" stroke-width="2">
    <!-- Connecting flow lines behind text -->
    <path d="M 100 80 Q 300 20 600 90 T 1100 60" fill="none" class="flow-line"/>
    <path d="M 50 220 Q 400 280 800 210 T 1150 240" fill="none" class="flow-line"/>
    <path d="M 150 150 C 350 220, 850 50, 1050 150" fill="none" stroke="#c084fc" stroke-opacity="0.2" class="flow-line"/>
  </g>

  <!-- Decorative dynamic node circles -->
  <circle cx="100" cy="80" r="8" fill="#38bdf8" class="node-pulse" style="animation-delay: 0s;"/>
  <circle cx="600" cy="90" r="10" fill="#818cf8" class="node-pulse" style="animation-delay: 1s;"/>
  <circle cx="1100" cy="60" r="7" fill="#c084fc" class="node-pulse" style="animation-delay: 0.5s;"/>
  <circle cx="150" cy="220" r="9" fill="#38bdf8" class="node-pulse" style="animation-delay: 1.5s;"/>
  <circle cx="800" cy="210" r="11" fill="#ec4899" class="node-pulse" style="animation-delay: 0.8s;"/>

  <!-- Dynamic background pill accents (behind text, low opacity) -->
  <rect x="80" y="40" width="140" height="32" rx="16" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.2"/>
  <rect x="980" y="220" width="160" height="36" rx="18" fill="#c084fc" fill-opacity="0.08" stroke="#c084fc" stroke-opacity="0.2"/>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="url(#text-grad)" letter-spacing="1">
      Awesome SaaS Integration &amp; Data Flow
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#e2e8f0" letter-spacing="0.5">
      ⚡ Curated iPaaS, Workflow Automation &amp; Self-Hosted Data Integration Ecosystem
    </text>

    <!-- Feature Tag Pills in Foreground -->
    <g transform="translate(600, 235)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
      <!-- Tag 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text y="4" fill="#38bdf8">🔌 Enterprise iPaaS</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
        <text y="4" fill="#818cf8">🔄 Workflow Engine</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(80, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
        <text y="4" fill="#c084fc">🚀 Open-Source ELT</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(235, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
        <text y="4" fill="#f472b6">📊 Streaming ETL</text>
      </g>
    </g>
  </g>
</svg>
